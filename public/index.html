<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>私の絵わかるよね？ Online</title><style>*{box-sizing:border-box}html,body{min-height:100%;overflow-x:hidden;overflow-y:auto}body{margin:0;background:#fff7e9;color:#352b22;font:15px system-ui,sans-serif;padding-bottom:160px}button,input,select{font:inherit;border:1px solid #cdbba3;border-radius:10px;padding:10px}button{background:#ffd07c}button:disabled{opacity:.4}input{min-width:0}main{max-width:850px;margin:auto;padding:10px 10px 300px}h1{font-size:21px;margin:7px 0}.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}.box{background:#fff;border-radius:12px;padding:10px}.muted{font-size:12px;color:#766454}#entry{position:fixed;inset:0;z-index:20;background:#fff7e9;display:flex;justify-content:center;align-items:center;padding:15px}#entry .box{width:min(450px,100%);box-shadow:0 8px 25px #0002}#entry input{width:100%;margin:5px 0}.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.roles button{height:85px}.active{outline:3px solid #e79523}#join{width:100%;font-weight:bold}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr;gap:6px}.grid.split{grid-template-columns:1fr 1fr}.canvasWrap{min-width:0;padding:0 24px}canvas{width:100%;height:auto;aspect-ratio:9/7;display:block;background:#fff;border:2px solid #c7b399;border-radius:10px;touch-action:pan-y}.split canvas{aspect-ratio:3/4}.canvasWrap label{font-weight:bold;font-size:12px}#chatLayer{position:fixed;z-index:5;bottom:80px;left:50%;transform:translateX(-50%);width:min(820px,calc(100% - 18px));height:clamp(130px,26vh,220px);background:#1e2023ad;color:white;border-radius:14px;backdrop-filter:blur(4px);padding:8px;display:flex;flex-direction:column;pointer-events:none}#chatLayer .row,#chat{pointer-events:auto}#chat{flex:1;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}#chat p{margin:4px 0;overflow-wrap:anywhere}#chatBar{position:fixed;z-index:6;bottom:8px;left:50%;transform:translateX(-50%);width:min(820px,calc(100% - 18px));display:flex;gap:5px;background:#fff8e9ee;padding:5px;border-radius:12px}#message{flex:1}.pill{background:#fff0cf;padding:8px;border-radius:9px}#answers{white-space:pre-wrap}#timer{font-size:22px;font-weight:bold;color:#bb4e19}#answerArea,#revealArea{scroll-margin-bottom:310px}@media(max-width:500px){.grid.split .canvasWrap{padding:0 10px}} </style></head><body><div id="entry"><div class="box"><h1>🎨 私の絵わかるよね？</h1><p>役割を選んで入室！</p><input id="name" placeholder="ニックネーム" maxlength="20"><input id="room" placeholder="部屋番号（例：yuki1234）" maxlength="40"><div class="roles"><button id="drawer" class="active">✏️ 描き手<br>最大2人</button><button id="viewer">👀 視聴者<br>人数制限なし*</button></div><button id="join">ゲームに入る</button><p id="err" class="muted"></p><p class="muted">*視聴者の実際の上限はサーバー容量に依存します。</p></div></div><main><h1>🎨 私の絵わかるよね？</h1><div class="pill" id="status">サーバーに接続しています...</div><div class="row"><b id="role"></b><button id="copy">部屋のURLをコピー</button><button id="leave">退室</button></div><div id="tools" class="hidden"><div class="row"><select id="mode"><option value="free">自由モード</option><option value="random">ランダムお題</option></select><button id="prompt">お題を出す</button><b id="topic"></b></div><div class="row"><input id="color" aria-label="ペン色" type="color" value="#252525"><input id="size" aria-label="ペンの太さ" type="range" min="2" max="30" value="5"><button id="erase">消しゴム</button><button id="clear">全消去</button><button id="finish">描き終わり</button></div></div><div id="grid" class="grid"><div class="canvasWrap" id="wrap0"><label id="label0">描き手①</label><canvas id="c0" width="720" height="560"></canvas></div><div class="canvasWrap hidden" id="wrap1"><label id="label1">描き手②</label><canvas id="c1" width="720" height="560"></canvas></div></div><h2 id="phase">お絵かき中</h2><div id="timer"></div><div id="answerArea" class="hidden row"><input id="answer" placeholder="答えを入力"><button id="submitAnswer">回答する</button></div><div id="revealArea" class="hidden row"><input id="correct" placeholder="正解を入力"><button id="reveal">正解発表！</button><button id="reset">次の問題</button></div><h3>みんなの回答</h3><div class="box" id="answers">発表まで非公開</div></main><div id="chatLayer"><div class="row" style="justify-content:space-between;margin:0"><b>💬 コメント（履歴は上へスワイプ）</b><button id="latest" style="padding:3px 8px">↓ 最新</button></div><div id="chat"></div></div><div id="chatBar"><input id="message" placeholder="コメントを入力"><button id="send">送信</button></div><script>
const $=id=>document.getElementById(id),canvas=[$('c0'),$('c1')],ctx=canvas.map(c=>c.getContext('2d'));let ws,roleChoice='drawer',role='viewer',slot=-1,joined=false,phase='draw',deadline=0,members=[null,null],room='',drawing=false,last=null,eraser=false,history=[],correct='';const params=new URLSearchParams(location.search);$('room').value=params.get('room')||'';function send(m){if(ws?.readyState===1)ws.send(JSON.stringify(m))}function log(t){$('status').textContent=t}function paint(line){let c=ctx[line.slot];if(!c)return;c.strokeStyle=line.color;c.lineWidth=line.size;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(line.x0,line.y0);c.lineTo(line.x1,line.y1);c.stroke()}function clear(s){ctx[s]?.clearRect(0,0,720,560)}function addChat(item){history.push(item);if(history.length>200)history.shift();renderChat()}function renderChat(){let el=$('chat'),near=el.scrollHeight-el.scrollTop-el.clientHeight<40;el.replaceChildren(...history.map(x=>{let p=document.createElement('p');p.textContent=x.name+'：'+x.text;return p}));if(near)el.scrollTop=el.scrollHeight}function updateCanvasScroll(){const canDraw=joined&&role==='drawer'&&phase==='draw';canvas.forEach((c,i)=>{c.style.touchAction=canDraw&&slot===i?'none':'pan-y'})}function view(){let draw=role==='drawer',two=members.filter(Boolean).length===2;$('tools').classList.toggle('hidden',!draw);$('answerArea').classList.toggle('hidden',draw||phase!=='answer');$('revealArea').classList.toggle('hidden',!draw||!['reveal','done'].includes(phase));$('reveal').disabled=phase!=='reveal';$('reset').disabled=phase!=='done';$('finish').disabled=phase!=='draw';$('grid').classList.toggle('split',!draw&&two);$('wrap0').classList.toggle('hidden',draw?slot!==0:false);$('wrap1').classList.toggle('hidden',draw?slot!==1:!two);members.forEach((m,i)=>$('label'+i).textContent=m?'✏️ '+m.name:'描き手'+(i+1)+'（空席）');$('role').textContent=draw?'✏️ 描き手'+(slot+1):'👀 視聴者';$('phase').textContent=({draw:'お絵かき中',answer:'回答タイム！',reveal:'回答締切・正解発表待ち',done:'正解発表！'})[phase];$('timer').textContent=phase==='answer'?Math.max(0,Math.ceil((deadline-Date.now())/1000))+'秒':'';updateCanvasScroll()}
$('drawer').onclick=()=>{roleChoice='drawer';$('drawer').classList.add('active');$('viewer').classList.remove('active')};$('viewer').onclick=()=>{roleChoice='viewer';$('viewer').classList.add('active');$('drawer').classList.remove('active')};$('join').onclick=()=>{room=$('room').value.trim().replace(/[^a-zA-Z0-9_-]/g,'');if(!room){$('err').textContent='英数字の部屋番号を入力してね';return}if(ws&&ws.readyState===1){send({type:'join',room,role:roleChoice,name:$('name').value});return}ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);$('join').disabled=true;ws.onopen=()=>{send({type:'join',room,role:roleChoice,name:$('name').value});$('join').disabled=false};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='error'){$('err').textContent=m.message;return}if(m.type==='joined'){joined=true;role=m.role;slot=m.slot;$('entry').classList.add('hidden');history=[];location.hash='room-'+room;log('オンライン接続中・部屋：'+room);updateCanvasScroll()}if(m.type==='snapshot'){members=m.members;phase=m.phase;deadline=m.deadline;canvas.forEach((_,i)=>{clear(i);(m.lines[i]||[]).forEach(paint)});history=m.chat||[];renderChat();if(m.phase==='done')result(m.correct,m.answers);view()}if(m.type==='state'){members=m.members;phase=m.phase;deadline=m.deadline;log('オンライン接続中｜参加 '+m.count+'人｜描き手 '+members.filter(Boolean).length+'/2');view()}if(m.type==='line')paint(m.line);if(m.type==='clear')clear(m.slot);if(m.type==='chat')addChat(m.item);if(m.type==='privateTopic')$('topic').textContent=m.topic?'お題：'+m.topic:'自由に描いてね';if(m.type==='waiting')log(m.name+'さんの描画が終了。もう1人を待っています');if(m.type==='answerAccepted'){$('answer').value='';$('answers').textContent='回答を受け付けました！'}if(m.type==='result'){result(m.correct,m.answers);view()}if(m.type==='reset'){canvas.forEach((_,i)=>clear(i));$('answers').textContent='発表まで非公開';$('topic').textContent='';correct='';view()}};ws.onclose=()=>{log('接続が切れました。再入室してください');joined=false;$('entry').classList.remove('hidden');$('join').disabled=false;updateCanvasScroll()};ws.onerror=()=>{$('err').textContent='接続できません。サーバーが起動しているか確認してください'}};
function result(c,answers){correct=c;$('answers').textContent='正解：'+c+'\n\n'+((answers||[]).length?(answers||[]).map(a=>a.name+'：'+a.text).join('\n'):'回答なし')}$('leave').onclick=()=>{ws?.close();location.reload()};$('copy').onclick=()=>{let url=location.origin+location.pathname+'?room='+encodeURIComponent(room);navigator.clipboard?.writeText(url).then(()=>log('部屋のURLをコピーしました')).catch(()=>prompt('URLをコピー',url))};canvas.forEach((c,i)=>{function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*720/r.width,y:(e.clientY-r.top)*560/r.height}}c.addEventListener('pointerdown',e=>{if(!joined||role!=='drawer'||slot!==i||phase!=='draw')return;drawing=true;last=pos(e);c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drawing||slot!==i)return;let p=pos(e),line={slot:i,x0:last.x,y0:last.y,x1:p.x,y1:p.y,color:eraser?'#ffffff':$('color').value,size:+$('size').value};paint(line);send({type:'line',line});last=p});['pointerup','pointercancel'].forEach(k=>c.addEventListener(k,()=>drawing=false))});$('erase').onclick=()=>{eraser=!eraser;$('erase').textContent=eraser?'ペンに戻す':'消しゴム'};$('clear').onclick=()=>{clear(slot);send({type:'clear'})};$('prompt').onclick=()=>send({type:'topic',mode:$('mode').value});$('finish').onclick=()=>send({type:'finish'});$('submitAnswer').onclick=()=>{let text=$('answer').value.trim();if(text)send({type:'answer',text})};$('reveal').onclick=()=>{let correct=$('correct').value.trim();if(correct)send({type:'reveal',correct})};$('reset').onclick=()=>send({type:'reset'});$('send').onclick=()=>{let text=$('message').value.trim();if(text){send({type:'chat',text});$('message').value=''}};$('message').onkeydown=e=>{if(e.key==='Enter')$('send').click()};$('latest').onclick=()=>$('chat').scrollTop=$('chat').scrollHeight;updateCanvasScroll();setInterval(()=>{if(joined)view()},300);
</script></body></html>
